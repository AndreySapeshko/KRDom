networks:
  internal:
    driver: bridge

services:

  postgres:
    image: postgres:15
    container_name: postgres
    env_file: .env
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    env_file: .env
    networks:
      - internal
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: ghcr.io/andreysapeshko/krdom-backend:${IMAGE_TAG}
    container_name: migrate
    env_file: .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  backend:
    image: ghcr.io/andreysapeshko/krdom-backend:${IMAGE_TAG}
    container_name: backend
    env_file: .env
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - static_volume:/app/static
      - logs_volume:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  telegrambot:
    image: ghcr.io/andreysapeshko/krdom-telegrambot:${IMAGE_TAG}
    container_name: telegrambot
    env_file: .env
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  frontend:
    image: ghcr.io/andreysapeshko/krdom-frontend:${IMAGE_TAG}
    container_name: frontend
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: ghcr.io/andreysapeshko/krdom-nginx:${IMAGE_TAG}
    container_name: nginx
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    volumes:
      - static_volume:/app/static
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  redis_data:
  static_volume:
  logs_volume:
