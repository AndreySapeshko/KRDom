worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    server {
        listen 80;
        server_name frame-dom.ru www.frame-dom.ru 5.129.240.229;

        location / {
            proxy_pass http://frontend:80;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            return 301 https://$host$request_uri;
        }
    }
    server {
        listen 443 ssl http2;
        server_name frame-dom.ru www.frame-dom.ru;

        ssl_certificate     /etc/letsencrypt/live/frame-dom.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/frame-dom.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # ---------- FRONTEND ----------
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }

        location = /index.html {
            proxy_pass http://frontend:80/index.html;
        }

        # ---------- API ----------
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- STATIC ----------
        location /static/ {
            proxy_pass http://backend:8000/static/;
            expires 30d;
            access_log off;
        }
    }
}
